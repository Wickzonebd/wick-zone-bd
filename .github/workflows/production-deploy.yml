name: Production Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskora-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: nfjxdqpzkcibzqdozpmt
  PAYMENT_BASE_URL: https://topadmin.paymently.io/api

jobs:
  probe-secrets:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/taskora-production-probe'
    name: Probe production secret readiness
    runs-on: ubuntu-latest
    steps:
      - name: Report configured deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          missing=0
          check_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "$name: configured"
            else
              echo "$name: MISSING"
              missing=1
            fi
          }
          check_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check_secret SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          check_secret SUPABASE_DB_PASSWORD "$SUPABASE_DB_PASSWORD"
          check_secret PAYMENT_API_KEY "$PAYMENT_API_KEY"
          if [ -n "$APP_URL" ]; then
            echo "APP_URL variable: configured"
          else
            echo "APP_URL variable: not configured (Cloudflare deployment URL will be used automatically)"
          fi
          exit "$missing"

  deploy-cloudflare:
    if: github.event_name != 'pull_request'
    name: Deploy Taskora to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.92.0'
          command: deploy

  deploy-supabase:
    if: github.event_name != 'pull_request'
    name: Deploy Supabase payments
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-cloudflare
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
      CUSTOM_APP_URL: ${{ vars.APP_URL }}
      DEPLOYMENT_URL: ${{ needs.deploy-cloudflare.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase and payment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PAYMENT_API_KEY" || { echo "Missing GitHub secret: PAYMENT_API_KEY"; exit 1; }
          APP_URL="${CUSTOM_APP_URL:-$DEPLOYMENT_URL}"
          test -n "$APP_URL" || { echo "Could not resolve production APP_URL"; exit 1; }
          case "$APP_URL" in
            https://*) ;;
            *) echo "Production APP_URL must use HTTPS"; exit 1 ;;
          esac
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply database migrations
        run: supabase db push --linked

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            "PAYMENT_API_KEY=$PAYMENT_API_KEY" \
            "PAYMENT_BASE_URL=$PAYMENT_BASE_URL" \
            "APP_URL=$APP_URL" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed secret names
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF"
