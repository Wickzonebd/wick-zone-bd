name: Production Backend Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskora-production-backend
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: nfjxdqpzkcibzqdozpmt
  PAYMENT_BASE_URL: https://topadmin.paymently.io/api

jobs:
  preflight:
    name: Check backend deployment readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check required secrets and app URL
        id: readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          missing=0
          check_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "$name: configured"
            else
              echo "$name: MISSING"
              missing=1
            fi
          }
          check_secret SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          check_secret SUPABASE_DB_PASSWORD "$SUPABASE_DB_PASSWORD"
          check_secret PAYMENT_API_KEY "$PAYMENT_API_KEY"
          if [ -n "$APP_URL" ]; then
            case "$APP_URL" in
              https://*) echo "APP_URL: configured" ;;
              *) echo "APP_URL: INVALID (HTTPS required)"; missing=1 ;;
            esac
          else
            echo "APP_URL: MISSING"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backend deploy skipped until the missing GitHub secrets/variable are configured."
          fi

  deploy-supabase:
    name: Deploy Supabase payment backend
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply database migrations
        run: supabase db push --linked

      - name: Set UddoktaPay Edge Function secrets
        run: |
          supabase secrets set \
            "PAYMENT_API_KEY=$PAYMENT_API_KEY" \
            "PAYMENT_BASE_URL=$PAYMENT_BASE_URL" \
            "APP_URL=$APP_URL" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed secret names
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF"
